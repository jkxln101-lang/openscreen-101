name: Publish release to WinGet

# Temporarily disabled - winget package requires Microsoft Store review
# Re-enable when ready to submit to winget-pkgs repository
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to winget (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: jkxln101-lang.OpenScreen101
          installers-regex: 'Setup\..*\.exe$'
          release-tag: ${{ inputs.tag }}
          token: ${{ secrets.WINGET_ACC_TOKEN }}
