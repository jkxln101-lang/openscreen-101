name: Publish Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ─── Windows ────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache caption assets
        uses: actions/cache@v4
        with:
          path: caption-assets
          key: caption-assets-${{ hashFiles('scripts/fetch-caption-model.mjs') }}

      - name: Build Windows app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/**/*.exe
          retention-days: 7

  # ─── macOS ──────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Ensure sharp prebuilt
        run: npm rebuild sharp
        env:
          npm_config_build_from_source: "false"

      - name: Cache caption assets
        uses: actions/cache@v4
        with:
          path: caption-assets
          key: caption-assets-${{ hashFiles('scripts/fetch-caption-model.mjs') }}

      - name: Build Vite + Electron
        run: npx tsc && npx vite build

      - name: Build native macOS helpers
        run: npm run build:native:mac
        env:
          OPENSCREEN_MAC_HELPER_ARCHS: ${{ matrix.arch }}

      # ─── Optional code signing ─────────────────────────────
      # Only runs when MAC_CERTIFICATE_P12 secret is set.
      # Without signing, the app still works but shows a Gatekeeper warning.
      - name: Import code signing certificate
        if: env.MAC_CERTIFICATE_P12 != ''
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$MAC_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Package .app bundle
        run: npx electron-builder --mac --${{ matrix.arch }} --dir
        env:
          CSC_NAME: ${{ secrets.MAC_CODESIGN_IDENTITY || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

      - name: Find .app bundle
        id: find_app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_BUNDLE=$(find "release/${VERSION}" -maxdepth 4 -name "*.app" -type d | head -n1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found"
            exit 1
          fi
          echo "app_bundle=$APP_BUNDLE" >> $GITHUB_OUTPUT

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          DMG_NAME="Openscreen-Mac-${ARCH}-${VERSION}.dmg"
          RELEASE_DIR="release/${VERSION}"
          DMG_OUTPUT="${RELEASE_DIR}/${DMG_NAME}"
          STAGING="${RELEASE_DIR}/dmg-staging"

          mkdir -p "$STAGING"
          cp -R "${{ steps.find_app.outputs.app_bundle }}" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -srcfolder "$STAGING" \
            -volname "Openscreen" \
            -fs HFS+ \
            -fsargs "-c c=64,a=16,e=16" \
            -format UDBZ \
            "$DMG_OUTPUT"

          rm -rf "$STAGING"

          echo "dmg_path=$DMG_OUTPUT" >> $GITHUB_OUTPUT
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      # ─── Optional DMG signing & notarization ────────────────
      - name: Sign DMG
        if: env.MAC_CERTIFICATE_P12 != ''
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          codesign --force \
            --sign "${{ secrets.MAC_CODESIGN_IDENTITY }}" \
            --timestamp \
            "${{ steps.dmg.outputs.dmg_path }}"

      - name: Notarize DMG
        if: env.MAC_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.dmg_path }}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
        timeout-minutes: 15

      - name: Staple notarization ticket
        if: env.MAC_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: xcrun stapler staple "${{ steps.dmg.outputs.dmg_path }}"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.dmg_path }}
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db || true

  # ─── Linux ──────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pacman build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Cache caption assets
        uses: actions/cache@v4
        with:
          path: caption-assets
          key: caption-assets-${{ hashFiles('scripts/fetch-caption-model.mjs') }}

      - name: Build Linux app
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            release/**/*.AppImage
            release/**/*.zsync
            release/**/*.deb
            release/**/*.pacman
          retention-days: 7

  # ─── Publish to GitHub Release ──────────────────────────────
  publish:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Flatten all artifacts into one directory
          mkdir -p /tmp/release-assets
          find artifacts -type f -exec cp {} /tmp/release-assets/ \;

          echo "Assets to upload:"
          ls -la /tmp/release-assets/

          # Upload each file to the release
          for file in /tmp/release-assets/*; do
            echo "Uploading $(basename "$file")..."
            gh release upload "$TAG" "$file" --repo "$REPO" --clobber
          done

          echo "All assets uploaded successfully!"
